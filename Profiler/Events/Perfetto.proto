// perfetto_subset.proto - Minimal Perfetto protos needed for trace generation
// Based on https://github.com/google/perfetto/tree/main/protos/perfetto/trace

// TODO: might have to use proto2
edition = "2023";

package perfetto.protos;

message Trace {
  repeated TracePacket packet = 1;
}

message TracePacket {
  uint64 timestamp = 8;  // Clock timestamp in nanoseconds

  oneof data {
    TrackEvent track_event = 11;
    TrackDescriptor track_descriptor = 60;
  }

  uint32 trusted_packet_sequence_id = 10;

  // For incremental state
  uint32 sequence_flags = 13;
}

message TrackDescriptor {
  uint64 uuid = 1;
  uint64 parent_uuid = 5;
  string name = 2;

  ProcessDescriptor process = 3;
  ThreadDescriptor thread = 4;
  CounterDescriptor counter = 8;
}

message ProcessDescriptor {
  int32 pid = 1;
  string process_name = 6;
}

message ThreadDescriptor {
  int32 pid = 1;
  int32 tid = 2;
  string thread_name = 5;
}

message CounterDescriptor {
  enum Unit {
    UNIT_UNSPECIFIED = 0;
    UNIT_TIME_NS = 1;
    UNIT_COUNT = 2;
    UNIT_SIZE_BYTES = 3;
  }
  Unit unit = 1;
}

message TrackEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_SLICE_BEGIN = 1;
    TYPE_SLICE_END = 2;
    TYPE_INSTANT = 3;
    TYPE_COUNTER = 4;
  }

  uint64 track_uuid = 11;
  Type type = 9;

  // Event name (use one of these)
  string name = 23;

  // Categories
  repeated string categories = 22;

  // For counter events
  int64 counter_value = 30;
  double double_counter_value = 44;

  // Flow correlation
  repeated uint64 flow_ids = 47;
  repeated uint64 terminating_flow_ids = 48;

  // Custom annotations
  repeated DebugAnnotation debug_annotation = 4;
}

message DebugAnnotation {
  string name = 10;

  oneof value {
    bool bool_value = 2;
    uint64 uint_value = 3;
    int64 int_value = 4;
    double double_value = 5;
    string string_value = 6;
  }
}